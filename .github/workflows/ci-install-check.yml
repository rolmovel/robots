name: CI - Install Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv and install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install -r curso/requirements.txt
      - name: Verify imports
        run: |
          . .venv/bin/activate
          python - <<'PY'
import importlib
names = [
    'openbb',
    'pandas',
    'numpy',
    'matplotlib',
    'plotly',
    'jupyterlab_myst',
  'curso',
]
failed = []
for n in names:
    try:
        importlib.import_module(n)
    except Exception as e:
        print('FAILED import', n, e)
        failed.append(n)
if failed:
    raise SystemExit('Imports failed: ' + ','.join(failed))
print('Basic imports OK')
PY
